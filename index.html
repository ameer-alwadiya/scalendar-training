<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Training</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f7f7f9'/%3E%3Crect width='64' height='24' rx='14' fill='%233e91ff'/%3E%3Crect y='12' width='64' height='12' fill='%233e91ff'/%3E%3Ctext x='32' y='53' font-size='27' font-weight='700' text-anchor='middle' fill='%23333' font-family='Arial,sans-serif'%3E31%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#fff;--fg:#000;--sub:#7b7b7f;--line:#ebebed;--card:#f3f3f5;--blue:#3e91ff;--red:#f0544f;--sat:#3e91ff;--sheet:#fff;--scrim:rgba(0,0,0,.4)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark;--bg:#000;--fg:#fff;--sub:#9a9aa0;--line:#232326;--card:#1c1c1e;--sheet:#1c1c1e;--red:#ff6b66}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#000;--fg:#fff;--sub:#9a9aa0;--line:#232326;--card:#1c1c1e;--sheet:#1c1c1e;--red:#ff6b66}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.3 "SamsungOne","Samsung Sans",Roboto,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{max-width:1100px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:2px;padding:max(14px,env(safe-area-inset-top)) 10px 6px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--card)}
.title{flex:1;display:flex;align-items:baseline;gap:8px;padding-left:6px;min-width:0}
.title b{font-size:30px;font-weight:600;letter-spacing:-.5px}
.title span{font-size:16px;color:var(--sub)}
#q{flex:1;min-width:0;height:44px;border:0;border-radius:22px;background:var(--card);color:var(--fg);padding:0 18px;font:inherit;font-size:16px;outline:0}
header.sr .title,header.sr .nv{display:none}header:not(.sr) #q{display:none}
.ti{width:24px;height:24px;border:2px solid currentColor;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700}
#main{flex:1;overflow:auto;position:relative}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--sub);padding:6px 4px}
.su{color:var(--red)}.sa{color:var(--sat)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(var(--rows),1fr);margin:0 4px}
.c{padding:3px 1px;overflow:hidden;min-width:0;cursor:pointer;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;margin:0 auto 1px;flex:none}
.n.td{background:var(--blue);color:#fff;font-weight:600}
.c.sel .n:not(.td){box-shadow:inset 0 0 0 1.5px var(--blue)}
.out .n{opacity:.4}.out .ch{opacity:.5}
.ch{font-size:10.5px;line-height:15px;height:15px;padding:0 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;background:color-mix(in srgb,var(--c) 22%,transparent);border-left:2.5px solid var(--c)}
.ch.a{background:var(--c);color:#fff;border-left:0}
.more{font-size:10px;color:var(--sub);padding-left:3px}
.mv{display:flex;flex-direction:column}
.dp{padding:14px 18px 110px}
.dp h3{font-size:15px;font-weight:600;margin-bottom:6px}
.ev{display:flex;gap:12px;padding:9px 0;cursor:pointer}
.ev i{width:4px;border-radius:2px;background:var(--c);flex:none}
.ev b{display:block;font-weight:500;font-size:16px}
.ev small{display:block;color:var(--sub);font-size:13px}
.empty{color:var(--sub);padding:28px 0;text-align:center}
@media(min-width:900px){.mv{flex-direction:row;height:100%}.mc{flex:1}.dp{width:340px;border-left:1px solid var(--line);overflow:auto}}
.tg{position:absolute;inset:0;display:flex;flex-direction:column}
.tgh,.adr,.tgi{display:grid;grid-template-columns:48px repeat(var(--n),1fr)}
.tgh{flex:none}
.dh{text-align:center;padding:2px 0;cursor:pointer}
.dh small{display:block;font-size:12px;color:var(--sub)}
.dh small.su{color:var(--red)}.dh small.sa{color:var(--sat)}
.adr{flex:none;border-bottom:1px solid var(--line);padding-bottom:4px}
.adr .gut{font-size:10px;color:var(--sub);padding:2px 4px}
.adc{padding:0 1px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tgb{flex:1;overflow:auto}
.tgi{position:relative}
.gut{position:relative}
.hl{position:absolute;left:0;right:6px;text-align:right;font-size:10px;color:var(--sub);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 51px,var(--line) 51px 52px)}
.tev{position:absolute;border-radius:6px;padding:2px 4px;font-size:11px;line-height:1.25;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--c) 28%,var(--bg));border-left:3px solid var(--c)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2}
.yv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding:10px 16px 110px}
.ym h4{font-size:15px;margin-bottom:4px;cursor:pointer;font-weight:600}
.ym h4.cm{color:var(--blue)}
.g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px}
.g span{padding:4px 0;position:relative;cursor:pointer}
.g .hd{color:var(--sub);cursor:default}
.g .td{background:var(--blue);color:#fff;border-radius:50%}
.g .dot::after{content:"";position:absolute;left:50%;bottom:0;width:3px;height:3px;border-radius:50%;background:var(--sub);transform:translateX(-50%)}
.ag{padding:6px 16px 110px}
.grp{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.dt{width:44px;text-align:center;font-size:12px;color:var(--sub);flex:none}
.dt b{display:block;font-size:24px;font-weight:500;color:var(--fg)}
.dt.td b{color:var(--blue)}
.list{flex:1;min-width:0}
#fab{position:fixed;right:max(22px,calc((100vw - 1100px)/2 + 22px));bottom:max(24px,env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(62,145,255,.45);z-index:5}
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:min(520px,100%);max-height:94%;overflow:auto;background:var(--sheet);border-radius:28px 28px 0 0;transform:translate(-50%,105%);visibility:hidden;transition:transform .25s,visibility .25s;z-index:21;padding:20px 22px max(20px,env(safe-area-inset-bottom))}
#sheet.on{transform:translate(-50%,0);visibility:visible}
@media(min-width:700px){#sheet{bottom:auto;top:50%;border-radius:28px;transform:translate(-50%,-46%);opacity:0;transition:transform .25s,opacity .2s,visibility .25s}#sheet.on{transform:translate(-50%,-50%);opacity:1}}
#ttl{width:100%;font:inherit;font-size:24px;font-weight:500;border:0;border-bottom:2px solid var(--blue);background:none;color:var(--fg);padding:6px 0 8px;outline:0}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);gap:10px}
.row input,.row select,.row textarea{background:var(--card);border:0;border-radius:10px;padding:8px 10px;color:var(--fg);font:inherit;min-width:0}
.row input[type=checkbox]{appearance:none;width:46px;height:28px;border-radius:14px;background:#c7c7cc;position:relative;padding:0;cursor:pointer;transition:background .2s}
.row input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.row input[type=checkbox]:checked{background:var(--blue)}
.row input[type=checkbox]:checked::after{transform:translateX(18px)}
.pair{display:flex;gap:6px}
.row.t input:not([type=date]):not([type=time]){flex:1;text-align:right}
.row.nt{align-items:flex-start}
.row.nt span{padding-top:8px}
.row textarea{flex:1;min-height:140px;resize:vertical;text-align:left;line-height:1.4;font-size:14px}
.ev small.nt{white-space:pre-line;margin-top:7px;line-height:1.55;font-size:12.5px;max-width:68ch}
.ev b{line-height:1.35}
.dp h3{font-size:17px;margin:4px 0 12px}
.dp .ev{padding:12px 0;border-bottom:1px solid var(--line)}
.dp .ev i{min-height:42px}
.dp .ev small:first-of-type{margin-top:3px}
#back{display:grid}
#workout{padding:18px 18px 110px;max-width:760px;margin:0 auto;width:100%}
.wtop{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:var(--sub);font-size:13px}
.whero{padding:20px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 18%,var(--card)),var(--card));margin-bottom:18px}
.whero h2{font-size:27px;line-height:1.15;margin:5px 0 10px;letter-spacing:-.5px}
.wmeta{display:flex;gap:8px;flex-wrap:wrap}.wmeta span{padding:6px 10px;border-radius:20px;background:var(--bg);font-size:12px;color:var(--sub)}
.wsection{margin:22px 0}.wsection h3{font-size:16px;margin-bottom:10px}.wfocus{padding:13px 15px;background:var(--card);border-radius:14px;color:var(--sub);line-height:1.55;font-size:14px}
.exercise{display:flex;align-items:flex-start;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.exercise input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--sub);background:transparent;flex:none;margin-top:0;cursor:pointer;display:grid;place-items:center;transition:background .2s,border-color .2s}
.exercise input:checked{background:#34c759;border-color:#34c759}
.exercise.done{background:color-mix(in srgb,#34c759 14%,transparent);border-radius:14px;padding-left:10px;padding-right:10px;border-bottom-color:transparent;margin:2px 0}
.exercise.done .exname{color:#248a3d}
:root[data-theme=dark] .exercise.done .exname{color:#30d158}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .exercise.done .exname{color:#30d158}}
.exercise.next{background:color-mix(in srgb,#ff3b30 14%,transparent);border-radius:14px;padding-left:10px;padding-right:10px;border-bottom-color:transparent;margin:2px 0}
.exercise.next .exname{color:#d70015}
.exercise.next input:not(:checked){background:#ff3b30;border-color:#ff3b30}
.exercise.next .exdetail{color:#ff3b30}
.exdetail:empty{display:none}
:root[data-theme=dark] .exercise.next .exname{color:#ff453a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .exercise.next .exname{color:#ff453a}}
.exercise input{width:5px;height:auto;min-height:38px;align-self:stretch;border:0;border-radius:3px;background:#c7c7cc;margin:0;pointer-events:none;cursor:default}
.exercise input:checked{background:#34c759}
.exercise.next input:not(:checked){background:#ff3b30}
.exname{font-weight:600;font-size:15px;line-height:1.35}.exmeta{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.4}
.wtip{font-size:13px;color:var(--sub);line-height:1.55;padding:12px 14px;background:var(--card);border-radius:13px;margin-top:8px}
.wprogress{font-size:12px;color:var(--sub);margin-top:10px}
.ag .ev small.nt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c)}
.sw.on{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--c)}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;height:48px;border-radius:24px;background:var(--card);font-weight:600}
.btn.p{background:var(--blue);color:#fff}.btn.d{color:var(--red)}

.subpage{padding:18px 18px 130px;max-width:760px;margin:0 auto;width:100%}
.subhero{padding:20px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 18%,var(--card)),var(--card));margin:8px 0 18px}
.subhero h2{font-size:25px;line-height:1.2;margin:7px 0}.subtag{font-size:11px;letter-spacing:.08em;color:var(--blue);font-weight:700}
.subcard{padding:15px;background:var(--card);border-radius:16px;margin:12px 0;line-height:1.55}
.subcard h3{font-size:15px;margin-bottom:7px}.subcard p{font-size:14px;color:var(--sub)}
.exercise-visual{display:block;width:100%;height:auto;max-height:230px;border-radius:14px;background:var(--card);margin:12px 0 4px}
.exercise-visual text{font-family:system-ui,sans-serif}
.substep{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.substep:last-child{border:0}
.subactions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.actionbtn{padding:12px 16px;border-radius:24px;background:var(--card);font-weight:650}.actionbtn.primary{background:var(--blue);color:white}
.actionbtn.start{background:#34c759;color:#fff}.actionbtn.finish{background:#f0544f;color:#fff}.actionbtn.rest{background:#8e8e93;color:#fff}.timerbox.resting{background:color-mix(in srgb,#8e8e93 16%,transparent);border-color:#8e8e93}.timerbox.resting .timerdigits{color:#8e8e93}
.timerbox,.repsbox,.userimagebox{padding:18px;border:1px solid var(--line);border-radius:18px;text-align:center;margin:16px 0}.timerdigits{font-size:42px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:6px}.timerlabel{font-size:12px;color:var(--sub)}.repstarget{font-size:28px;font-weight:750;margin:8px 0}.userexerciseimage{display:block;width:100%;max-height:300px;object-fit:contain;border-radius:12px;margin:10px auto}.uploadhint{font-size:12px;color:var(--sub);margin-top:7px}.imageactions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.exercise-main{flex:1;min-width:0}.exdetail{font-size:12px;color:var(--blue);margin-top:6px;font-weight:600}
.wsection h3{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--card);border-radius:12px}
#drawer{position:fixed;left:0;top:0;bottom:0;width:300px;max-width:86%;background:var(--sheet);transform:translateX(-105%);visibility:hidden;transition:transform .25s,visibility .25s;z-index:21;padding:max(24px,env(safe-area-inset-top)) 10px 24px;overflow:auto}
#drawer.on{transform:none;visibility:visible}
#drawer h2{font-size:26px;padding:6px 14px 14px}
#drawer h5{font-size:13px;color:var(--sub);font-weight:500;padding:6px 14px}
#drawer hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.di{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;font-size:16px;cursor:pointer}
.di.on{background:var(--card);font-weight:600}
.di input{width:20px;height:20px}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#323232;color:#fff;padding:12px 18px;border-radius:22px;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
#main{user-select:none;-webkit-user-select:none}
.c.rng{background:color-mix(in srgb,var(--blue) 20%,transparent)}
.ghost{position:absolute;left:2px;right:2px;border-radius:6px;background:color-mix(in srgb,var(--blue) 35%,transparent);border:2px solid var(--blue);pointer-events:none;z-index:3}
.notebox{padding:16px;border:1px solid var(--line);border-radius:18px;margin:16px 0}
.notebox h3{font-size:15px;margin-bottom:8px}
#exnote{display:block;width:100%;min-height:110px;max-height:70vh;overflow:auto;white-space:pre-wrap;word-break:break-word;border:0;border-radius:12px;background:var(--card);color:var(--fg);padding:12px;font:inherit;font-size:14px;line-height:1.5;outline:0;user-select:text;-webkit-user-select:text}
#exnote:empty::before{content:attr(data-ph);color:var(--sub);pointer-events:none}
#exnote img{display:block;max-width:100%;max-height:360px;height:auto;border-radius:10px;margin:8px 0;cursor:pointer}
.nthumbs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.nthumb{position:relative;width:88px;height:88px;border-radius:12px;overflow:hidden;background:var(--card);cursor:pointer}
.nthumb img{width:100%;height:100%;object-fit:cover;display:block}
.nthumb.big{width:100%;height:auto;max-height:440px}.nthumb.big img{height:auto;max-height:440px;object-fit:contain}
.nthumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;display:grid;place-items:center}
.exthumb{position:relative;width:54px;height:54px;border-radius:10px;overflow:hidden;flex:none;background:var(--card);cursor:pointer;align-self:center}
.exthumb img{width:100%;height:100%;object-fit:cover;display:block}
.exthumb span{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;line-height:1;padding:2px 5px;border-radius:8px}
.urlrow{display:flex;gap:8px;margin-top:10px}
.urlrow input{flex:1;min-width:0;border:0;border-radius:12px;background:var(--card);color:var(--fg);padding:10px 12px;font:inherit;font-size:14px;outline:0;user-select:text;-webkit-user-select:text}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Phone polish ===== */
.title{overflow:hidden}.title b,.title span{white-space:nowrap}
@media(max-width:480px){.title{flex-direction:column;align-items:flex-start;gap:0;justify-content:center}.title b{font-size:22px;line-height:1.1}.title span{font-size:13px;line-height:1.2}header .ib{width:40px;height:40px}header{gap:0;padding-left:6px;padding-right:6px}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@supports(height:100dvh){html,body{height:100dvh}}
body{overscroll-behavior-y:none}
#main,.dp,#sheet,#drawer{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#app{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#main{padding-bottom:env(safe-area-inset-bottom)}
button,[role=button],select,input,.c,.ev,.tev,.dh,.exercise-main{touch-action:manipulation}
#exnote{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;font-size:16px;line-height:1.45}
.row input,.row select,.row textarea,#q{font-size:16px}
.actionbtn{min-height:48px;padding:13px 18px}
.exercise-main{padding:4px 0;min-height:48px}
.exname,.whero h2,.subhero h2{overflow-wrap:anywhere}
@media(max-width:480px){
.title b{font-size:26px}
.whero{padding:16px;border-radius:20px}.whero h2{font-size:24px}
.subpage{padding:14px 14px 140px}
.subactions .actionbtn{flex:1 1 calc(50% - 8px);text-align:center}
.timerdigits{font-size:48px}
.wmeta span{font-size:11px;padding:5px 9px}
}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <button class="ib" id="back" aria-label="Back to previous calendar view" title="Back" style="display:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <button class="ib" id="menu" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="title" id="title"></div>
    <input id="q" type="search" placeholder="Search events" aria-label="Search events">
    <button class="ib nv" id="prev" aria-label="Previous"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <button class="ib nv" id="next" aria-label="Next"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
    <button class="ib" id="sbtn" aria-label="Search"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
    <button class="ib" id="today" aria-label="Go to today"><span class="ti" id="tn"></span></button>

 const g=guidanceFor(x.name,x.raw),rest=(x.raw.match(/rest\s*(\d+)\s*(min|s|sec)/i)||[]),secs=rest[1]?Number(rest[1])*(/min/i.test(rest[2])?60:1):60;
 const repMatch=x.raw.match(/(\d+)\s*[x×]\s*(\d+(?:\s*[-–]\s*\d+)?)/i);
 const isTimedSet=/\d+\s*[x×]\s*\d+(?:\s*[-–]\s*\d+)?\s*(?:s|sec|seconds)\b/i.test(x.raw);
 const isDistance=/\d+\s*[x×]\s*\d+\s*m\b/i.test(x.raw);
 const per=(x.raw.match(/\d\s*(?:s|sec|m)?\s*\/\s*(side|arm|leg)\b/i)||[])[1];
 const unit=(isTimedSet?'sec':isDistance?'m':'reps')+(per?' per '+per:'');
 const setCount=repMatch?Number(repMatch[1]):0;
 const target=repMatch?`${repMatch[1]} sets × ${repMatch[2]} ${unit}`:'';
 const flowKey=exerciseFlowKey();
 const flow=exerciseFlow[flowKey]||(exerciseFlow[flowKey]={phase:'idle',set:1});
 const isWarm=/warm.?up/i.test(x.name+' '+x.raw),isCool=/cool.?down/i.test(x.name+' '+x.raw);
 const note=getNote(activeWorkout?.id||'',x.name);
 const steps=isWarm?['Complete 2–3 minutes of easy movement.','Perform each mobility or activation drill with control.','Finish feeling warm and ready for the main lift.']:isCool?['Slow your breathing and walk gently for a minute.','Move through the listed stretches on both sides.','Finish feeling relaxed; do not force end range.']:['Set up your position and equipment before starting.','Perform the prescribed sets and repetitions with controlled technique.','Rest as prescribed, then repeat.'];
 const warmItems=(isWarm||isCool)?(x.raw.includes(' · ')?x.raw.split(' · '):x.raw.split(':').slice(1).join(':').split(',')).map(t=>t.trim()).filter(Boolean):[];
 const warmGuide=warmItems.map((item,i)=>{const z=guidanceFor(item,item);return `<div class="substep"><b>${i+1}. ${esc(item)}</b><p style="color:var(--sub);margin-top:5px">${esc(z.how)}</p><p style="color:var(--sub);font-size:12px;margin-top:4px">${esc(z.cue)}</p></div>`}).join('');
 let tracker='';
 if(setCount>0){
   if(flow.phase==='idle'||flow.phase==='ready'){
     tracker=`<div class="timerbox"><div class="timerlabel">SET PROGRESS</div><div class="repstarget">${target}</div><div class="uploadhint">${flow.set} of ${setCount} sets</div><div class="subactions" style="justify-content:center"><button class="actionbtn start" id="setstart">Start set ${flow.set}</button></div></div>`;
   }else if(flow.phase==='active'){
     tracker=`<div class="timerbox"><div class="timerlabel">SET ${flow.set} IN PROGRESS</div><div class="repstarget">${isTimedSet?`${repMatch[2]} sec hold${per?' per '+per:''}`:`${repMatch[2]} ${unit}`}</div><div class="uploadhint">Complete the set with controlled technique, then mark it finished.</div><div class="subactions" style="justify-content:center"><button class="actionbtn finish" id="setfinish">Finish set ${flow.set}</button></div></div>`;
   }else if(flow.phase==='rest'){
     tracker=`<div class="timerbox resting"><div class="timerlabel">REST BEFORE SET ${flow.set+1}</div><div class="timerdigits" id="timerdigits">${fmtTimer(timerRemaining||secs)}</div><div class="subactions" style="justify-content:center"><button class="actionbtn rest" id="skiprest">Skip rest</button></div></div>`;
   }else if(flow.phase==='done'){
     tracker=`<div class="repsbox"><div class="timerlabel">ALL SETS COMPLETE</div><div class="repstarget">${setCount} / ${setCount} sets</div><div class="uploadhint">Great work. Finish the exercise to save it as completed.</div></div>`;
   }
 }else{
   tracker=flow.phase==='active'
    ?`<div class="timerbox"><div class="timerlabel">EXERCISE IN PROGRESS</div><div class="uploadhint">When you have finished, tap the button below.</div><div class="subactions" style="justify-content:center"><button class="actionbtn finish" id="finishplain">Finish exercise</button></div></div>`
    :flow.phase==='done'
     ?`<div class="repsbox"><div class="timerlabel">EXERCISE FINISHED</div></div>`
     :`<div class="timerbox"><div class="timerlabel">READY WHEN YOU ARE</div><div class="subactions" style="justify-content:center"><button class="actionbtn start" id="startplain">Start exercise</button></div></div>`;
 }
 const canComplete=flow.phase==='done';
 return `<div class="subpage"><div class="wtop"><span>WORKOUT</span><span>·</span><span>${esc(x.section)}</span></div><div class="subhero"><div class="subtag">EXERCISE GUIDE</div><h2>${esc(x.name)}</h2><div class="exmeta">${esc(x.raw)}</div></div><section class="subcard"><h3>How to do it</h3><p>${esc(g.how)}</p></section><section class="subcard"><h3>${isWarm?'Warm-up sequence':isCool?'Cool-down sequence':'Step by step'}</h3>${(isWarm||isCool)&&warmGuide?warmGuide:steps.map((v,i)=>`<div class="substep"><b>${i+1}.</b> ${esc(v)}</div>`).join('')}</section><section class="subcard"><h3>Technique cues</h3><p>${esc(g.cue)}</p></section>${tracker}<div class="notebox"><h3>Notes</h3><div id="exnote" contenteditable="true" role="textbox" aria-multiline="true" data-ph="Write notes, or paste an image / GIF here…" spellcheck="true">${note.html}</div><div class="uploadhint">Type notes and paste images or GIFs right into this box. Tap an image to remove it.${saveStatus()}</div></div><div class="subactions"><button class="actionbtn" id="subback">Back to workout</button>${canComplete?'<button class="actionbtn start" id="subcomplete">Finish exercise</button>':''}</div></div>`;
}

function shrinkImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('read'));

  im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};
  im.src=r.result};r.readAsDataURL(file)})}

let gcid=lg('sc_gcid')||'',tok=null,tokExp=0,tc=null,gRange=null,pend=null;
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}

const loadGIS=()=>new Promise((res,rej)=>{if(window.google&&google.accounts)return res();const s=document.createElement('script');
 s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error('Could not load Google sign-in. Check your connection.'));document.head.appendChild(s)});
const getTok=()=>tok&&Date.now()<tokExp?Promise.resolve():new Promise((res,rej)=>{if(!tc)return rej(new Error('Connect Google Calendar first'));pend={res,rej};tc.requestAccessToken({prompt:''})});
async function gcall(path,opt={}){await getTok();
 const r=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/'+path,{...opt,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'}});
 if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error(m||'Google returned '+r.status)}
 return r.status==204?null:r.json()}
const fromG=i=>{const ad=!!i.start.date;return{id:'g_'+i.id,gid:i.id,title:i.summary||'(No title)',cal:'google',allDay:ad,
 start:ad?i.start.date+'T00:00':iso(new Date(i.start.dateTime)),end:ad?key(addD(parse(i.end.date+'T00:00'),-1))+'T00:00':iso(new Date(i.end.dateTime)),loc:i.location||'',note:i.description||''}};
function toG(o,patch){const b={summary:o.title,location:o.loc,description:o.note},tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
 if(o.allDay){b.start={date:o.start.slice(0,10)};b.end={date:key(addD(parse(o.end),1))};if(patch){b.start.dateTime=null;b.end.dateTime=null}}
 else{b.start={dateTime:parse(o.start).toISOString(),timeZone:tz};b.end={dateTime:parse(o.end).toISOString(),timeZone:tz};if(patch){b.start.date=null;b.end.date=null}}
 const R={daily:'DAILY',weekly:'WEEKLY',biweekly:'WEEKLY;INTERVAL=2',monthly:'MONTHLY',yearly:'YEARLY'}[o.rep];if(R)b.recurrence=['RRULE:FREQ='+R];return b}
async function gload(){const a=addD(cur,-200),b=addD(cur,200);gRange={a,b};
 try{let items=[],pt='';
  do{const d=await gcall('events?singleEvents=true&maxResults=2500&timeMin='+encodeURIComponent(a.toISOString())+'&timeMax='+encodeURIComponent(b.toISOString())+(pt?'&pageToken='+pt:''));items=items.concat(d.items||[]);pt=d.nextPageToken}while(pt);
  ev=ev.filter(e=>e.cal!='google').concat(items.filter(i=>i.status!='cancelled'&&i.start&&i.end).map(fromG));render()}
 catch(e){gRange=null;toast(e.message)}}
async function gconnect(){
 if(location.protocol=='file:')return toast('Google sign-in needs a web address. Run "python -m http.server 8080" in this folder, then open http://localhost:8080/'+(location.pathname.split('/').pop()||'')+'');
 if(!gcid){gcid=(prompt('Paste your Google OAuth client ID')||'').trim();if(!gcid)return;ls('sc_gcid',gcid)}
 try{await loadGIS();
  tc=google.accounts.oauth2.initTokenClient({client_id:gcid,scope:'https://www.googleapis.com/auth/calendar.events',
   callback:r=>{const p=pend;pend=null;if(r.error){p&&p.rej(new Error('Google sign-in failed: '+r.error));if(!p)toast('Google sign-in failed: '+r.error);return}
    tok=r.access_token;tokExp=Date.now()+(r.expires_in-60)*1000;p&&p.res();if(!p)gload()},
   error_callback:e=>{const p=pend;pend=null;p&&p.rej(new Error('Google sign-in was closed or blocked'));if(!p)toast('Google sign-in was closed or blocked')}});
  tc.requestAccessToken({prompt:''})}catch(e){toast(e.message)}}
function gdisconnect(){try{google.accounts.oauth2.revoke(tok)}catch(e){}tok=null;gRange=null;ev=ev.filter(e=>e.cal!='google');render()}

  const nimg=e.target.closest('#exnote img');if(nimg&&activeSubExercise){if(confirm('Remove this image from the note?')){nimg.nextSibling&&nimg.nextSibling.nodeName==='BR'&&nimg.nextSibling.remove();nimg.remove();saveNoteBox()}return}
 const sub=e.target.closest('[data-subex]');if(sub){activeSubExercise={name:decodeURIComponent(sub.dataset.subex),raw:decodeURIComponent(sub.dataset.subraw||''),section:sub.closest('.wsection')?.querySelector('h3')?.textContent?.replace('OPEN DETAILS ↗','').trim()||'SESSION'};view='exercise';render();pushPageState();return}

 const m=e.target.closest('[data-m]');if(m){cur=new Date(cur.getFullYear(),+m.dataset.m,1);return setView('month')}
 const c=e.target.closest('.col');if(c){const r=c.getBoundingClientRect();return newEv(parse(c.dataset.t),Math.min(23,Math.floor((e.clientY-r.top)/HH)))}

/* mouse drag: select several days (month) or a time range (week/day) */
let drag=null,suppress=false;
const endDrag=()=>{drag=null;main.querySelectorAll('.rng').forEach(x=>x.classList.remove('rng'));main.querySelectorAll('.ghost').forEach(x=>x.remove())};
main.addEventListener('pointerdown',e=>{
 if(e.pointerType=='touch'||e.button!==0||e.target.closest('[data-e]'))return;
 const c=e.target.closest('.c');
 if(c&&view=='month'){drag={t:'m',a:c.dataset.d,b:c.dataset.d,moved:false};return}
 const col=e.target.closest('.col');
 if(col){const m=Math.floor((e.clientY-col.getBoundingClientRect().top)/HH*2)*30;drag={t:'t',col,a:m,b:m,day:col.dataset.t,moved:false}}
});
document.addEventListener('pointermove',e=>{if(!drag)return;
 if(drag.t=='m'){const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest('.c');if(!c)return;
  drag.b=c.dataset.d;drag.moved=drag.moved||drag.b!=drag.a;
  const lo=drag.a<drag.b?drag.a:drag.b,hi=drag.a<drag.b?drag.b:drag.a;
  main.querySelectorAll('.c').forEach(x=>x.classList.toggle('rng',drag.moved&&x.dataset.d>=lo&&x.dataset.d<=hi))}
 else{drag.b=Math.max(0,Math.min(1410,Math.floor((e.clientY-drag.col.getBoundingClientRect().top)/HH*2)*30));
  if(drag.b!=drag.a)drag.moved=true;if(!drag.moved)return;
  let g=drag.col.querySelector('.ghost');if(!g)drag.col.appendChild(g=Object.assign(document.createElement('div'),{className:'ghost'}));
  const lo=Math.min(drag.a,drag.b),hi=Math.max(drag.a,drag.b)+30;g.style.top=lo/60*HH+'px';g.style.height=(hi-lo)/60*HH+'px'}
});
document.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;endDrag();if(!d.moved)return;
 suppress=true;setTimeout(()=>suppress=false,0);
 if(d.t=='m'){const lo=d.a<d.b?d.a:d.b,hi=d.a<d.b?d.b:d.a;openSheet({start:lo+'T00:00',end:hi+'T00:00',allDay:true,cal:'my'})}
 else{const lo=Math.min(d.a,d.b),hi=Math.min(1440,Math.max(d.a,d.b)+30),b=parse(d.day),at=m=>new Date(b.getFullYear(),b.getMonth(),b.getDate(),0,m);
  openSheet({start:iso(at(lo)),end:iso(at(hi)),cal:'my'})}

const d2b=u=>{const m=/^data:([^;,]+)?(;base64)?,(.*)$/s.exec(u);const bin=atob(m[3]);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m[1]||'application/octet-stream'})};
const upl=new WeakSet();
async function offloadImages(){if(!ASSETS)return;const el=$('#exnote');if(!el)return;
 for(const im of [...el.querySelectorAll('img')]){const src=im.getAttribute('src')||'';if(!src.startsWith('data:')||upl.has(im))continue;upl.add(im);
  try{const r=await ASSETS.upload(d2b(src));if(r&&r.url&&im.isConnected){im.setAttribute('src',r.url);saveNoteBox()}}catch(e){upl.delete(im)}}}
(async()=>{try{
 if(!(window.claude&&claude.use))return;
 const [db,user,assets]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('assets')]);
 ASSETS=assets||null;if(!db||!user)return;
 const uid=await user.id();COL=db.collection('data/users/'+uid);
 const snap=await COL.get(),have=new Set();
 snap.docs.forEach(d=>{const o=d.data()||{},k=o.k;if(!k||typeof o.v!=='string'||NOSYNC.test(k))return;have.add(k);if(dirty.has(k))return;MEM[k]=o.v;try{localStorage.setItem(k,o.v)}catch(e){}});
 try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^sc_(exnote|done|subdone|hide|ws|theme|userev)/.test(k)&&!have.has(k)){MEM[k]=localStorage.getItem(k);dirty.add(k)}}}catch(e){}
 SYNCED=true;

 READY=true;save();dirty.forEach(k=>flush(k));render();
}catch(e){}})();
